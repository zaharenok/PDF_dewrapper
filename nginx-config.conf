# Nginx configuration for DocFix
# Place this file in: /etc/nginx/sites-available/docfix
# Create symlink: sudo ln -s /etc/nginx/sites-available/docfix /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Upstream backend
upstream docfix_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    
    server_name your-domain.com www.your-domain.com;
    
    # Redirect all HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;
    
    # For initial testing without SSL:
    
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/docfix_access.log;
    error_log /var/log/nginx/docfix_error.log;
    
    # Frontend static files
    location / {
        proxy_pass http://docfix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://docfix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeouts for image processing
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Upload endpoint with stricter rate limiting
    location /api/dewarp {
        limit_req zone=upload_limit burst=5 nodelay;
        
        proxy_pass http://docfix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for heavy processing
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
    
    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://docfix_backend;
        access_log off;
    }
    
    # Static results and uploads
    location /results/ {
        proxy_pass http://docfix_backend;
        proxy_cache_valid 200 1h;
    }
    
    location /uploads/ {
        proxy_pass http://docfix_backend;
        proxy_cache_valid 200 1h;
    }
}

